# From hyprland_src
source = ~/.config/hypr/hyprland_src/monitors.conf
source = ~/.config/hypr/hyprland_src/looknfeel.conf
source = ~/.config/hypr/hyprland_src/input.conf
source = ~/.config/hypr/hyprland_src/windows.conf

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$terminal = alacritty
$fileManager = nautilus
$menu = walker


#################
### AUTOSTART ###
#################

# Autostart necessary processes 
exec-once = waybar & hyprpaper & hypridle & elephant & walker --gapplication-service & swayosd-server


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = GDK_SCALE,1
env = GDK_DPI_SCALE,1
env = QT_SCALE_FACTOR,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,0
env = WLR_NO_HARDWARE_CURSORS,1
env = GTK_USE_PORTAL,1
env = XDG_CURRENT_DESKTOP=hyprland


###################
### PERMISSIONS ###
###################

# See https://wiki.hyprland.org/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

ecosystem {
  no_update_news = true
}


